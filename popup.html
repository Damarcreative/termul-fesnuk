<!DOCTYPE html>
<html>

<head>
    <title>FB TERMUL</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <h2>FB TERMUL</h2>

    <div class="row">
        <label>
            <input type="checkbox" id="toggleMode">
            Extension Active
        </label>
    </div>

    <hr>

    <div class="row">
        <label>Server URL:</label>
        <input type="text" id="serverUrl" placeholder="http://localhost:3000">
        <button id="saveServerBtn" style="margin-top: 5px;">Save & Ping</button>
    </div>

    <div class="row">
        <small>Status: <span id="serverStatus">Checking...</span></small>
    </div>

    <hr>

    <div class="row">
        <input type="text" id="searchInput" placeholder="Cari nama...">
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Nama</th>
                    <th>Profil</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated here -->
            </tbody>
        </table>
    </div>

    <script src="popup.js"></script>
</body>

</html>
